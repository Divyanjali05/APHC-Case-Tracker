version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aphc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aphc_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-aphc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aphc_dev_secret}
    # Bound to 127.0.0.1 to avoid exposing database publicly
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aphc_user} -d ${POSTGRES_DB:-aphc_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aphc_redis
    restart: unless-stopped
    # Bound to 127.0.0.1 to avoid exposing Redis broker publicly
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
